name: Build USC-CAM (iOS .ipa + Windows .exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project USBWebcam.xcodeproj \
                     -scheme USBWebcam \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/USBWebcam.app"
          test -d "$APP" || { echo "App not found"; find build -name "*.app" -maxdepth 6; exit 1; }
          rm -rf Payload output
          mkdir -p Payload output
          cp -r "$APP" Payload/
          zip -qry output/USC-CAM.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: output/USC-CAM.ipa

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pyqt5 pyvirtualcam pyinstaller

      - name: Build single-file EXE
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name "USC-CAM" \
            --icon desktop/icon.ico \
            --add-data "desktop/icon.ico;." \
            --paths desktop \
            --collect-all pyvirtualcam \
            desktop/main.py

      - name: Add camera driver (gives the webcam the name "HD Camera USC-CAM")
        shell: bash
        run: |
          git clone --depth 1 https://github.com/schellingb/UnityCapture.git uc
          echo "--- files in UnityCapture repo:"
          find uc -type f -not -path "uc/.git/*" | head -60
          mkdir -p dist/driver
          find uc -type f -iname "UnityCaptureFilter*.dll" -not -path "uc/.git/*" -exec cp -v {} dist/driver/ \;
          ls dist/driver
          if [ ! -f dist/driver/UnityCaptureFilter64bit.dll ]; then
            echo "UnityCaptureFilter64bit.dll not found in repo - see file list above"; exit 1
          fi
          cp desktop/Install-HD-Camera.bat desktop/Uninstall-HD-Camera.bat dist/

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/USC-CAM.exe
            dist/driver/
            dist/Install-HD-Camera.bat
            dist/Uninstall-HD-Camera.bat

  package-zip:
    name: Bundle final ZIP
    needs: [build-ios, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release/

      - name: Create ZIP
        run: |
          cd release
          zip -r ../USC-CAM-Package.zip .

      - name: Upload Complete Bundle
        uses: actions/upload-artifact@v4
        with:
          name: USC-CAM-Package
          path: USC-CAM-Package.zip
